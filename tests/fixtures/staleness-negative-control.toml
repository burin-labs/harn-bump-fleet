# The pin-staleness heartbeat's negative control. Its one consumer names a pin
# file that does not exist, so the live check must report it `unknown` and
# stale. If a change to the live read made a missing pin look current, the
# heartbeat goes red on this fixture instead of the alarm going quietly green.
schema_version = 1

[fleet]
default_root = "~/projects"
default_branch = "main"

[policy]
package_workflow = "burin-labs/.github/.github/workflows/harn-package.yml@546968aa9c3c08be94df6730f7e504fbfbe94450"
bump_workflow = "burin-labs/harn/.github/workflows/bump-harn.yml@e9eb3ff18d066cf85b570395a19b5a0a3013af57"

[[repositories]]
slug = "burin-labs/harn-bump-fleet"
directory = "harn-bump-fleet"
harn_pin_kind = "version_file"
harn_pin_path = "tests/fixtures/no-such-harn-version"
