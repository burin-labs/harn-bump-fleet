# harn-bump-fleet label taxonomy
#
# The priority, status, and effort categories below are copied verbatim from the
# canonical source, `burin-labs/.github` `.github/labels.yml`. Do not edit them
# here. Change the canonical file and copy the result back.
#
# `area/*` is repository-specific. The values below come from this repository's
# own directory map and match the `[Area]` tags used in pull request titles, so
# a label and a title say the same word. See AGENTS.md for the title convention.
#
# Rules:
#   - Additive only. Never delete a label this repository already has.
#   - Rename rather than delete and recreate. A rename keeps every issue and
#     pull request attached to the label.
#   - There is no `type/*` prefix. The unprefixed GitHub defaults (bug,
#     enhancement, documentation, duplicate, question, wontfix) already carry
#     type, and `epic` and `production-readiness` are single facts rather than
#     categories with siblings. Reuse those instead of inventing a prefix.

priority:
  - name: priority/p0
    color: "b60205"
    description: Must have, ships before anything else in flight
  - name: priority/p1
    color: "d93f0b"
    description: High priority
  - name: priority/p2
    color: "fbca04"
    description: Medium priority
  - name: priority/p3
    color: "0e8a16"
    description: Lower priority

status:
  - name: status/blocked
    color: "d93f0b"
    description: Cannot proceed until a named dependency clears
  - name: status/in-progress
    color: "0e8a16"
    description: An agent or engineer is actively working this
  - name: status/needs-decision
    color: "fbca04"
    description: Needs a founder or code-owner ruling before work continues
  - name: status/ready
    color: "0e8a16"
    description: Scoped and unblocked, ready to pick up

effort:
  - name: effort/small
    color: "c2e0c6"
    description: Hours
  - name: effort/medium
    color: "fbca04"
    description: A day or two
  - name: effort/large
    color: "d93f0b"
    description: Multi-day or multi-PR

area:
  - name: area/release
    color: "1d76db"
    description: Harn release cut, ship, tag, watch, and publication proof
  - name: area/fleet
    color: "1d76db"
    description: fleet.toml membership, policy, dispatch, and repair
  - name: area/bump
    color: "1d76db"
    description: Runtime bump orchestration, pins, and bump workflow adapters
  - name: area/projections
    color: "1d76db"
    description: Fleet-owned file projections, drift checks, and convergence
  - name: area/ci
    color: "1d76db"
    description: This repository's workflows and required checks
  - name: area/scripts
    color: "1d76db"
    description: Launchers and wrappers under scripts/
  - name: area/docs
    color: "1d76db"
    description: README, AGENTS.md, CONTRIBUTING.md, and docs/
  - name: area/tests
    color: "1d76db"
    description: tests/ and tests-risky/ coverage

reused-unprefixed:
  # Already present in this repository. Reuse these for type instead of adding
  # a parallel prefixed label.
  - bug
  - enhancement
  - documentation
  - duplicate
  - question
  - wontfix
  - good first issue
  - help wanted
