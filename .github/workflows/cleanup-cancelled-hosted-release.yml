name: Clean canceled hosted release lane

# Process-level defer owns ordinary terminal cleanup. A canceled Actions job
# can be killed before that defer runs, so this workflow starts only after the
# exact hosted release run is terminal and independently proves its identity.
on:
  workflow_run:
    workflows: [Hosted harn release]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  cleanup:
    name: Release exact canceled lane
    if: github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Check out terminal cleanup owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
        with:
          version-file: .harn-version

      - name: Install locked Harn dependencies
        run: harn install --locked

      # Missing artifacts are data, not a successful no-op. The Harn owner
      # accepts absence only when the exact job page proves the release harness
      # never started or ran in read-only audit mode.
      - name: Download exact lane claim
        id: lane-claim
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-lane-claim-${{ github.event.workflow_run.id }}
          repository: burin-labs/harn-bump-fleet
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: canceled-lane-claim

      - name: Mint scoped release cleanup token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          repositories: harn
          permission-contents: write

      - name: Release exact canceled lane
        env:
          HOSTED_WORKFLOW_TOKEN: ${{ github.token }}
          HOSTED_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          HOSTED_RUN_ID: ${{ github.event.workflow_run.id }}
          HOSTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HOSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LANE_CLAIM_OUTCOME: ${{ steps.lane-claim.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          harn run --no-sandbox cleanup_cancelled_hosted_release.harn -- \
            --workflow-run-id "$HOSTED_RUN_ID" \
            --workflow-run-attempt "$HOSTED_RUN_ATTEMPT" \
            --workflow-head-sha "$HOSTED_HEAD_SHA" \
            --claim-receipt canceled-lane-claim/hosted-release-lane-claim.json \
            --artifact-outcome "$LANE_CLAIM_OUTCOME" \
            --receipt-out .harn-runs/hosted-release-lane-cleanup.json \
            --apply --yes-live-release

      - name: Upload terminal lane cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lane-cleanup-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .harn-runs/hosted-release-lane-cleanup.json
          retention-days: 14
          if-no-files-found: error
