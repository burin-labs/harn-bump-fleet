name: Reap held convergence chain leases

# A hosted update round leases `refs/heads/harn-update-chain/<chain id>` and
# releases it on the way out. A round that dies before it can run that release
# leaves the lease held, and a fresh chain then has to be started around the
# dead one instead of resuming it. This clears the residue, and only the
# residue: a chain with a live run, an unreadable run list, or no resolvable run
# at all is reported and left alone.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the plan without deleting any ref."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "31 4 * * *"

permissions:
  contents: read

concurrency:
  group: reap-chain-refs
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint chain lease reap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-actions: read
          permission-contents: write

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Reap terminal chain leases
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--json)
          if [[ "$DRY_RUN" != "true" ]]; then
            args+=(--apply --yes-delete-refs)
          fi
          harn run --no-sandbox reap_chain_refs.harn -- "${args[@]}" \
            | tee chain-ref-reap-receipt.json
          jq -r '"chain lease reap: inventory=\(.inventory) examined=\(.examined_count) cleared=\(.cleared_count) retained=\(.retained_count) failed=\(.failed_count)"' \
            chain-ref-reap-receipt.json >&2
          jq -r '(.refs // [])[] | select(.action == "retain") | "left held: \(.ref) [\(.reason_code)] \(.message)"' \
            chain-ref-reap-receipt.json >&2

      - name: Upload chain lease reap receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-bump-fleet-chain-ref-reap
          path: chain-ref-reap-receipt.json
          if-no-files-found: error
