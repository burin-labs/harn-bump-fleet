name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@c3d3025db6297d736400911029f34f7983744deb

  release-harness:
    name: Release harness integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@b0ea1ede50c546dd4b83ee1b924c45466ff00a60
      - name: Install locked dependencies
        run: harn install --locked
      - name: Verify release-only risky behavior
        run: harn test tests-risky --approve-risky git.push
      - name: Enforce source-size policy
        run: harn run --no-sandbox check_source_length.harn
      - name: Exercise mock release flow
        run: harn run --no-sandbox release_harn.harn -- --mock --agent --mode ship-pr

  status:
    name: CI status
    if: always()
    needs: [package, release-harness]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@c3d3025db6297d736400911029f34f7983744deb
        with:
          results-json: ${{ toJSON(needs.*.result) }}
