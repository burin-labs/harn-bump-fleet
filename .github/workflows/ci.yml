name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # The release preflight is the one job here that reads live state: the App
  # mint it asserts, and the consumer contracts it compares, can both go bad
  # without anything in this repository changing. An hourly run is what turns
  # "the release found out at the cut" into "main found out an hour ago".
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule'
    uses: burin-labs/.github/.github/workflows/harn-package.yml@546968aa9c3c08be94df6730f7e504fbfbe94450

  unit-tests:
    name: Harn unit suite
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history is required to measure every PR-range commit message.
          fetch-depth: 0
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
      - name: Install locked dependencies
        run: harn install --locked
      - name: Scan public pull-request metadata
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: harn run --no-sandbox check_public_metadata_privacy.harn
      - name: Run bounded parallel unit suite
        run: harn test tests/ --parallel --timeout 120000

  release-harness:
    name: Release harness integration
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
      - name: Install locked dependencies
        run: harn install --locked
      - name: Verify release-only risky behavior
        run: harn test tests-risky --approve-risky git.push
      - name: Enforce source-size policy
        run: harn run --no-sandbox check_source_length.harn
      - name: Enforce workflow checkout credential policy
        run: harn run --no-sandbox check_workflow_checkout_credentials.harn
      - name: Enforce pull-request title convention
        # The census reads the area list from burin-labs/harn's own title-gate
        # workflow and refuses when it cannot, so the step needs a credential
        # for that public read. The job's other steps are offline mocks.
        env:
          GH_TOKEN: ${{ github.token }}
        run: harn run --no-sandbox check_pr_title_convention.harn
      - name: Exercise mock release flow
        run: harn run --no-sandbox release_harn.harn -- --mock --agent --mode ship-pr

      # The retired release-rehearsal workflow perturbed the operator
      # environment across a matrix whose only substantive leg was the baseline
      # above. These two repeats keep the perturbation coverage on the required
      # job; the scrubbing they exercise is also asserted deterministically in
      # tests/release_commands.harn.
      - name: Exercise mock release flow under a poisoned operator environment
        env:
          HARN_BIN: /tmp/harn-poison/harn
          HARN_EGRESS_ALLOW: file:///tmp/harn-poison
        run: harn run --no-sandbox release_harn.harn -- --mock --agent --mode ship-pr

      - name: Exercise mock release flow under TMPDIR pressure
        env:
          TMPDIR: ${{ runner.temp }}/release-tmpdir-pressure
          TMP: ${{ runner.temp }}/release-tmpdir-pressure
          TEMP: ${{ runner.temp }}/release-tmpdir-pressure
        run: |
          mkdir -p "$TMPDIR"
          harn run --no-sandbox release_harn.harn -- --mock --agent --mode ship-pr

  # Every release precondition, asked against live state, on this repository's
  # own pull requests. The renderer, the fleet manifest, and the token profiles
  # all live here, and a change to any of them is what put the release's own
  # preconditions out of date. Asking them here means such a change fails its
  # own pull request instead of a release attempt.
  release-preflight:
    name: Release launch preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately not `environment: release`. That environment is restricted to
    # protected branches, so a pull request could not enter it at all, and the
    # App credentials this job needs are organization secrets rather than
    # environment ones. The signing key, which is environment-scoped, is not a
    # release precondition this job can or should ask about.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
      - name: Install locked dependencies
        run: harn install --locked

      # A pull request from a fork gets no secrets. That must not read as a
      # clean preflight, and it must not read as a broken one either: the run
      # below drops to --offline, which asks every structural precondition for
      # real and reports the credentialed ones as not asked.
      - name: Resolve whether this context holds release credentials
        id: credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_APP_CLIENT_ID}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint fleet policy read token
        if: steps.credentials.outputs.available == 'true'
        id: fleet-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: read

      - name: Ask every release precondition
        env:
          CREDENTIALS_AVAILABLE: ${{ steps.credentials.outputs.available }}
          GH_TOKEN: ${{ steps.fleet-policy-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.fleet-policy-token.outputs.token }}
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .harn-runs
          # ship-pr is the widest mode, so this asks every precondition a cut
          # can reach rather than the subset an audit would.
          args=(--mode ship-pr --bump patch)
          if [ "${CREDENTIALS_AVAILABLE}" != "true" ]; then
            args+=(--offline)
          fi
          ./scripts/preflight_release_launch.sh "${args[@]}" \
            --receipt .harn-runs/release-launch-preflight.json

      - name: Upload the preflight receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-launch-preflight
          path: .harn-runs/release-launch-preflight.json
          if-no-files-found: warn

  status:
    name: CI status
    if: always() && github.event_name != 'schedule'
    needs: [package, unit-tests, release-harness, release-preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@546968aa9c3c08be94df6730f7e504fbfbe94450
        with:
          results-json: ${{ toJSON(needs.*.result) }}
