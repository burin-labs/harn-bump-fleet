name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harn-project:
    name: Harn project
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@7313a4bd8fe95b93239971457513a5adb6d46fcd
      - name: Install locked dependencies
        run: harn install --locked
      - name: Verify Harn project
        run: |
          scripts/harn-project.sh --tracked-only verify
          harn test tests/ --parallel
          harn test tests-risky/release_ref_cleanup_git_push.harn --approve-risky git.push
      - name: Enforce source-size policy
        run: harn run --no-sandbox check_source_length.harn
      - name: Exercise mock release flow
        run: harn run --no-sandbox release_harn.harn -- --mock --agent --mode ship-pr

  status:
    name: CI status
    if: always()
    needs: [harn-project]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          PROJECT_RESULT: ${{ needs.harn-project.result }}
        run: test "$PROJECT_RESULT" = success
