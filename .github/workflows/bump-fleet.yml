name: Update repositories for a Harn release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest release."
        required: false
        type: string
      only:
        description: "Optional owner/repo target."
        required: false
        type: string
      enable_repair:
        description: "Allow bounded agent repair when a downstream update fails checks."
        required: false
        type: boolean
        default: true
      update_round:
        description: "Automatic follow-up round; leave at 1 for a new update."
        required: false
        type: string
        default: "1"
      max_rounds:
        description: "Maximum hosted rounds for one Harn version."
        required: false
        type: string
        default: "4"
  schedule:
    - cron: "43 9 * * *"

permissions:
  contents: read

concurrency:
  group: bump-harn-fleet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # This protected-branch environment holds the two brokered provider
    # references. Without it GitHub expands both secret expressions to empty
    # strings, so a repair can never reach a model despite looking configured.
    environment: release
    timeout-minutes: 180
    env:
      # GitHub App installation tokens live for one hour. Keep each polling
      # period comfortably below that boundary and mint a fresh token per wait.
      FLEET_TOKEN_EPOCH_TIMEOUT_S: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve exact update target and bounded round
        id: update-plan
        env:
          REQUESTED_TARGET: ${{ inputs.version }}
          REQUESTED_ROUND: ${{ inputs.update_round || '1' }}
          REQUESTED_MAX_ROUNDS: ${{ inputs.max_rounds || '4' }}
          REQUESTED_REPAIR: ${{ inputs.enable_repair }}
        shell: bash
        run: |
          set -euo pipefail
          target="$REQUESTED_TARGET"
          if [[ -z "$target" ]]; then
            target="$(gh api repos/burin-labs/harn/releases/latest --jq .tag_name)"
          fi
          if [[ ! "$target" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Harn target must be an exact vX.Y.Z release tag, got '$target'" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_ROUND" =~ ^[1-9][0-9]*$ ]] \
            || [[ ! "$REQUESTED_MAX_ROUNDS" =~ ^[1-9][0-9]*$ ]] \
            || (( REQUESTED_ROUND > REQUESTED_MAX_ROUNDS )); then
            echo "update round must be a positive integer no greater than max rounds" >&2
            exit 1
          fi
          repair="${REQUESTED_REPAIR:-true}"
          if [[ "$repair" != "true" && "$repair" != "false" ]]; then
            echo "enable_repair must resolve to true or false" >&2
            exit 1
          fi
          {
            echo "target=$target"
            echo "round=$REQUESTED_ROUND"
            echo "max_rounds=$REQUESTED_MAX_ROUNDS"
            echo "repair_enabled=$repair"
          } >> "$GITHUB_OUTPUT"

      - name: Mint fleet GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: &fleet-app-token
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-actions: write
          # The bump workflows publish their first commit with their own
          # repository token. This token can append only a validated repair,
          # under the exact observed branch-head lease.
          permission-contents: write
          permission-pull-requests: write

      - name: Install exact target Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
        with:
          version: ${{ steps.update-plan.outputs.target }}

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Arm Git credentials for private fleet clones
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The helper reads the step-scoped token only when Git asks. The
          # secret never enters an argument, URL, repository config, or log.
          gh auth setup-git --hostname github.com

      - name: Materialize manifest-owned fleet
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          FLEET_ROOT: ${{ runner.temp }}/harn-bump-fleet
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--root "$FLEET_ROOT")
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          harn run --no-sandbox materialize_fleet.harn -- "${args[@]}" \
            | tee fleet-checkout-receipt.json

      - name: Mint repository update GitHub App token
        id: converge-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: *fleet-app-token

      - name: Start Harn updates
        # A downstream failure is the input to observe/repair, not the final
        # job verdict. `Prove fleet convergence` remains the authoritative gate.
        if: steps.update-plan.outputs.round == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.converge-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.converge-token.outputs.token }}
          FLEET_ROOT: ${{ runner.temp }}/harn-bump-fleet
          TARGET: ${{ steps.update-plan.outputs.target }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          args+=(--fleet-root "$FLEET_ROOT" --harn-repo "$FLEET_ROOT/harn" --retry-failed 1 --no-chat)
          args+=("$TARGET")
          harn run --no-sandbox bump_fleet.harn -- "${args[@]}" \
            | tee fleet-bump-receipt.md

      - name: Mint observation GitHub App token
        id: observe-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: *fleet-app-token

      - name: Check Harn updates
        id: observe-convergence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.observe-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.observe-token.outputs.token }}
          TARGET: ${{ steps.update-plan.outputs.target }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--timeout-s "$FLEET_TOKEN_EPOCH_TIMEOUT_S" --interval-s 30)
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          args+=("$TARGET")
          harn run --no-sandbox wait_fleet_convergence.harn -- "${args[@]}" \
            | tee fleet-convergence-receipt.json

      - name: Mint repair GitHub App token
        id: repair-token
        if: >-
          steps.observe-convergence.outcome == 'failure' &&
          steps.update-plan.outputs.repair_enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: *fleet-app-token

      - name: Repair failed Harn updates
        if: >-
          steps.observe-convergence.outcome == 'failure' &&
          steps.update-plan.outputs.repair_enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.repair-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.repair-token.outputs.token }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HARN_UPDATE_PROVIDER_SECRET_REFERENCE: CEREBRAS_API_KEY
          HARN_UPDATE_VALUE_PROVIDER: cerebras
          HARN_UPDATE_VALUE_MODEL: gpt-oss-120b
          HARN_UPDATE_STRONG_PROVIDER: cerebras
          HARN_UPDATE_STRONG_MODEL: zai-glm-4.7
          HARN_UPDATE_CONTROLLER_REVISION: ${{ github.sha }}
          FLEET_ROOT: ${{ runner.temp }}/harn-bump-fleet
          TARGET: ${{ steps.update-plan.outputs.target }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--fleet-root "$FLEET_ROOT" --max-attempts 3 --max-cost-per-attempt-usd 0.30 --max-cost-per-repository-usd 0.90 --max-cost-per-run-usd 4.00)
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          args+=("$TARGET")
          harn run --no-sandbox repair_fleet_convergence.harn -- "${args[@]}" \
            | tee fleet-repair-receipt.json

      - name: Mint proof GitHub App token
        id: proof-token
        if: always()
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: *fleet-app-token

      - name: Prove Harn updates
        id: prove-convergence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.proof-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.proof-token.outputs.token }}
          TARGET: ${{ steps.update-plan.outputs.target }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--timeout-s "$FLEET_TOKEN_EPOCH_TIMEOUT_S" --interval-s 30)
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          args+=("$TARGET")
          harn run --no-sandbox wait_fleet_convergence.harn -- "${args[@]}" \
            | tee fleet-convergence-proof-receipt.json

      - name: Schedule the next hosted round when proof is still incomplete
        if: always()
        env:
          GH_TOKEN: ${{ steps.proof-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.proof-token.outputs.token }}
          TARGET: ${{ steps.update-plan.outputs.target }}
          ROUND: ${{ steps.update-plan.outputs.round }}
          MAX_ROUNDS: ${{ steps.update-plan.outputs.max_rounds }}
          ENABLE_REPAIR: ${{ steps.update-plan.outputs.repair_enabled }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--target "$TARGET" --proof-receipt fleet-convergence-proof-receipt.json --update-round "$ROUND" --max-rounds "$MAX_ROUNDS" --enable-repair "$ENABLE_REPAIR")
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          harn run --no-sandbox continue_harn_update.harn -- "${args[@]}" \
            | tee fleet-update-continuation-receipt.json

      - name: Mint projection verification GitHub App token
        id: projection-token
        if: always()
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with: *fleet-app-token

      # Deliberately AFTER dispatch. This step ran first under `set -euo
      # pipefail`, so drift in a *projection* aborted the job and not one
      # repository bumped. `[policy] bump_workflow` pins a SHA of a file that
      # moved six times in two weeks, and every move puts all 26 fleet-owned
      # adapters out of conformance at once -- so the check was red by
      # construction and took the fleet down with it for three days
      # (2026-08-01..03).
      #
      # The check is a report; dispatch is the job's purpose. Running it last
      # keeps the alarm -- drift still fails the run, and the receipt is still
      # written because `tee` flushes before the pipeline's exit status is
      # taken -- without letting a stale pin decide whether the fleet may bump.
      - name: Verify remote fleet projections
        env:
          GH_TOKEN: ${{ steps.projection-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.projection-token.outputs.token }}
        run: |
          set -euo pipefail
          harn run --no-sandbox check_fleet_policy.harn \
            | tee fleet-policy-receipt.json

      - name: Upload fleet receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-update-receipts
          path: |
            fleet-checkout-receipt.json
            fleet-convergence-receipt.json
            fleet-convergence-proof-receipt.json
            fleet-repair-receipt.json
            fleet-repair-startup-receipt.json
            fleet-update-continuation-receipt.json
            .harn-runs/fleet-repair/
            fleet-policy-receipt.json
            fleet-bump-receipt.md
          if-no-files-found: error

      - name: Require exact update proof
        if: always()
        env:
          PROOF_OUTCOME: ${{ steps.prove-convergence.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROOF_OUTCOME" != "success" ]]; then
            echo "Harn update is not proven in this hosted round; the bounded continuation receipt names any successor." >&2
            exit 1
          fi
