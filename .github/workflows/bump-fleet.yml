name: Bump Harn Fleet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest release."
        required: false
        type: string
      only:
        description: "Optional owner/repo target."
        required: false
        type: string
  schedule:
    - cron: "43 9 * * *"

permissions:
  contents: read

concurrency:
  group: bump-harn-fleet
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint fleet GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-actions: write
          permission-contents: read

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@b0ea1ede50c546dd4b83ee1b924c45466ff00a60

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Verify remote fleet projections
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          harn run --no-sandbox check_fleet_policy.harn \
            | tee fleet-policy-receipt.json

      - name: Dispatch fleet bump adapters
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ inputs.version }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          if [[ -n "$TARGET" ]]; then
            args+=("$TARGET")
          fi
          harn run --no-sandbox dispatch_bump_fleet.harn -- "${args[@]}" \
            | tee fleet-dispatch-receipt.json

      - name: Upload dispatch receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-bump-fleet-dispatch
          path: |
            fleet-policy-receipt.json
            fleet-dispatch-receipt.json
          if-no-files-found: error
