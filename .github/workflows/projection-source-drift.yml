name: Watch Projection Sources

# The missing half of the projection convergence trigger.
#
# A projection has two inputs: the renderer here, and the canonical source file
# in another repository. A renderer change dispatches convergence on the merge
# that makes it. A source change matched nothing at all, so every consumer
# reading that file stayed stale until the daily cron, which is how a release
# came to refuse at its publication gate on contracts nobody had re-rendered.
#
# The comparison lives here rather than in each source repository on purpose. A
# source repository cannot filter on consumers it has never heard of, and
# raising the dispatch from there would mean a credential in every source
# repository that can fire a workflow in this one. A source that never received
# that secret would then silently never dispatch, which is the failure shape
# being removed, not a new one to accept.
#
# Hourly, alongside the daily convergence sweep rather than instead of it: the
# cron remains the backstop that repairs anything this comparison mis-reads.
#
# This job records nothing. A dispatch being accepted says only that a run
# started; a run that fails, is cancelled, or opens a repair nobody merges
# leaves the consumer as stale as it was. The convergence run writes the record
# for each consumer it observed already matching, so this comparison keeps
# asking until the bytes are in place.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the comparison without dispatching convergence."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: projection-source-drift
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as the convergence job: a persisted credential leaves an
          # `include.path` in .git/config pointing at a $RUNNER_TEMP file, and a
          # later step that reads git under a different temp root dies on the
          # config rather than on its own work. This job reads its records with
          # `git ls-remote` against a public repository and needs no credential
          # to do it.
          persist-credentials: false

      - name: Mint fleet GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          # Read and dispatch, nothing else. This job writes no record: the
          # convergence run owns those, because only it knows whether a
          # consumer's bytes actually match. It opens no pull request and
          # touches no consumer repository either.
          permission-contents: read
          permission-actions: write

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@11681af676a5e4dc4200cfee683150cdec26763f

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Compare canonical sources against their last convergence
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            args+=(--dry-run)
          fi
          harn run --no-sandbox check_projection_source_drift.harn -- "${args[@]}" \
            | tee projection-source-drift-receipt.json

      - name: Upload the comparison receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-bump-fleet-projection-source-drift
          path: projection-source-drift-receipt.json
          if-no-files-found: error
