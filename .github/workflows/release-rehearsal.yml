name: Release rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/release-rehearsal.yml"
      - "release_harn.harn"
      - "watch_harn_release.harn"
      - "lib/**"
      - "tests/**"
      - "prompts/**"
      - ".harn-version"
      - "harn.lock"
      - "harn.toml"
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e7898bd182a38422f9e012c63c8cd4c61d254932

      - name: Install Harn dependencies
        run: harn install --locked

      - name: Run release rehearsal
        shell: bash
        run: |
          set -euo pipefail
          harn run --no-sandbox release_harn.harn -- --rehearsal --no-chat | tee release-rehearsal.md
          cat release-rehearsal.md >> "$GITHUB_STEP_SUMMARY"
