name: Release rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/release-rehearsal.yml"
      - "release_harn.harn"
      - "watch_harn_release.harn"
      - "lib/**"
      - "tests/**"
      - "prompts/**"
      - ".harn-version"
      - "harn.lock"
      - "harn.toml"
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      - name: Install Harn dependencies
        run: harn install --locked

      - name: Run release rehearsal
        shell: bash
        run: |
          set -euo pipefail
          harn run --no-sandbox release_harn.harn -- --rehearsal --no-chat | tee release-rehearsal.md
          cat release-rehearsal.md >> "$GITHUB_STEP_SUMMARY"
