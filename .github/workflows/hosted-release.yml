name: Hosted harn release

# Runs release_harn.harn on a GitHub-hosted runner instead of an operator
# laptop. Both burin-labs/harn and burin-labs/harn-bump-fleet are public, so
# the runner minutes are free, and the ~17 minutes of Rust compilation that
# dominate a local release (prepare + release-cli-aot) move off the operator
# machine entirely.
#
# Tags are signed by a dedicated release bot key held only in this workflow's
# `release` environment. The maintainer's personal key is deliberately not
# reachable from any runner. The trade is provenance: tags now carry the bot's
# identity rather than the maintainer's, and because the tagger is a GitHub App
# bot — which cannot hold SSH signing keys on GitHub — the web UI shows them as
# unverified. The signature is real and anyone can check it from this repo:
#
#   git -c gpg.ssh.allowedSignersFile=.github/release-bot-allowed-signers \
#     verify-tag v<version>
#
# Restoring the green badge would mean signing as a machine user account
# instead of the App bot.
#
# The release *commit* is a different problem with a different answer. The
# release repository's `main` ruleset requires signatures, and GitHub counts
# only a signature it can attribute to the committer's account — so a commit
# signed with this bot key is refused, and the release PR would sit blocked with
# every check green (burin-labs/harn-bump-fleet#660). `--github-signed-commit`
# has the harness create that commit through `createCommitOnBranch` instead,
# which GitHub signs server-side under the App token already minted below. No
# additional secret, and the tag path is untouched.
#
# Secret exposure controls, in layers, because both repos are public:
#
#   1. `workflow_dispatch` is the only trigger. GitHub restricts manual
#      dispatch to actors with write access, so no fork, pull request, or
#      outside contributor can start this run.
#   2. The job binds to the `release` environment. Its protection rules
#      (required reviewers, `main`-only deployment branches) gate the secrets:
#      the job pauses before any secret is materialized until a reviewer
#      approves, so even a write-access collaborator cannot spend the API key
#      unattended.
#   3. Top-level `permissions` is read-only. Write access to burin-labs/harn
#      comes from a separately scoped, short-lived GitHub App token.
#   4. Free-text inputs never reach a shell as interpolated text; they cross
#      into `run:` blocks through the environment so a crafted value cannot
#      escape into the command line.
#   5. Every third-party action is pinned by commit SHA.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for the next release.
        type: choice
        options: [patch, minor, major]
        default: patch
      mode:
        description: >-
          audit is read-only. prepare builds and certifies the candidate and
          stops before the tag. ship-pr signs and pushes the tag, then opens
          the release PR.
        type: choice
        options: [audit, prepare, ship-pr]
        default: audit
      at_sha:
        description: >-
          Optional 40-character base pin. Blank pins the release at
          origin/main when the run starts.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hosted-harn-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.mode }} v-next (${{ inputs.bump }})
    runs-on: ubuntu-latest
    # A cold-cache prepare compiles the workspace twice over (the release gate's
    # own target directory plus the separate package-check target) on a 4-core
    # runner, where the same lanes take ~30 minutes on a 12-core laptop. The
    # ceiling exists to stop a wedged run, not to bound a slow one.
    timeout-minutes: 300
    environment: release

    steps:
      - name: Check out release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harn-bump-fleet
          persist-credentials: false

      # Scoped to burin-labs/harn only. `audit` never writes, but the same
      # token serves both modes so the checkout remote is uniform; the
      # harness itself is what decides whether a write happens.
      - name: Mint scoped release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          repositories: harn
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      # Full history: the harness reconciles tags, walks commit evidence back
      # to the previous release, and adds a release worktree.
      - name: Check out harn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/harn
          path: harn
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # This job is the one that both reads git under a Harn sandbox and
          # pushes, so it is the one where persisted credentials cannot stay.
          # `persist-credentials: true` leaves an `include.path` in .git/config
          # pointing at a $RUNNER_TEMP file; git reads that include on every
          # invocation and treats an unreadable one as fatal, and the sandbox
          # jails reads to the workspace. Run 30995854515 lost the release to
          # exactly that: `verify_release_metadata` could not resolve HEAD.
          # The push half is armed below instead.
          persist-credentials: false

      # The credential helper is what makes the line above survivable. Git
      # consults a helper only when a transport authenticates, never while
      # parsing config, so the sandboxed audit scripts keep working and the
      # harness still pushes `release-attempt/...`, the certify branch, and the
      # signed tag.
      - name: Arm git push credentials
        uses: burin-labs/harn/.github/actions/git-push-credentials@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The github connector's allow_gh_auth_fallback reads `gh auth token` when
      # GH_TOKEN is unset. Seed that store with the same mint the credential
      # helper just got, so API calls and git pushes share one refreshable path.
      - name: Arm gh auth for API calls
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "${GH_TOKEN}" | gh auth login --with-token --hostname github.com
          gh auth token --hostname github.com >/dev/null

      # The action proves the credential resolves. This proves the whole path:
      # the remote, the transport, and write access on this repository.
      #
      # It has to be its own step because `prepare` never pushes — it stops
      # after building the candidate — so a green prepare run says nothing about
      # whether `ship-pr` can publish `release-attempt/...` and the tag. Without
      # this, a broken push surfaces for the first time in the one mode where
      # the release is already half-spent.
      #
      # `--dry-run` performs the full authenticated receive-pack handshake and
      # sends no ref update, so the probe branch is never created. `--no-verify`
      # skips hooks that this checkout does not install anyway.
      - name: Prove the push path authenticates
        working-directory: harn
        run: |
          set -euo pipefail
          git push --dry-run --no-verify origin \
            "HEAD:refs/heads/push-preflight-${GITHUB_RUN_ID}"

      # The release gate creates the tag with `git tag -s` and then gates on
      # `git verify-tag`, so the runner needs both halves of an identity: a
      # private key to sign with, and an allowed-signers file to verify
      # against. The key is the release bot's own, never the maintainer's —
      # a personal signing key must not be reachable from a runner.
      #
      # The tagger is a GitHub App bot, and an App bot cannot hold SSH signing
      # keys on GitHub, so GitHub's web UI will show these tags as unverified.
      # The signature is real and checkable by anyone from this repository:
      # `git -c gpg.ssh.allowedSignersFile=.github/release-bot-allowed-signers
      # verify-tag v<version>`. Moving the badge back would mean signing as a
      # machine user account instead of the App bot.
      - name: Identify and arm the release signer
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          ALLOWED_SIGNERS: ${{ github.workspace }}/harn-bump-fleet/.github/release-bot-allowed-signers
        run: |
          set -euo pipefail

          # RUNNER_TEMP is outside both checkouts, so the key cannot be picked
          # up by a status check, an archive step, or a stray `git add -A`.
          key_path="${RUNNER_TEMP}/release-signing-key"
          umask 077
          printf '%s\n' "${RELEASE_SIGNING_KEY}" > "${key_path}"
          chmod 600 "${key_path}"

          # Global, not repository-scoped. The harness builds the candidate in a
          # linked worktree under harn-worktrees/, and identity has to reach it
          # and every git subprocess the gate spawns without depending on which
          # config file a worktree happens to resolve.
          git config --global user.name "harn-release-bot[bot]"
          git config --global user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey "${key_path}"
          git config --global gpg.ssh.allowedSignersFile "${ALLOWED_SIGNERS}"
          # Deliberately not `commit.gpgsign`. The release commit is created
          # through GitHub (`--github-signed-commit` below), because a signature
          # made with this key is one GitHub cannot attribute to the App bot and
          # the ruleset would refuse it. Signing it locally as well would only
          # produce a second signature nothing checks.

          # Prove the identity round-trips before spending a release on it.
          # Run 30828370900 spent 21 minutes building a candidate it could not
          # sign, because nothing checked the signer until the gate reached it.
          #
          # The tag is the only half this key still signs. The release commit is
          # GitHub's, and its signature cannot be probed from here — the harness
          # asks GitHub for the verdict on the exact commit instead, which is the
          # same question the ruleset asks.
          probe="${RUNNER_TEMP}/signing-probe"
          rm -rf "${probe}" && mkdir -p "${probe}"
          git -C "${probe}" init -q
          git -C "${probe}" commit -q --allow-empty --no-gpg-sign -m probe
          git -C "${probe}" tag -s probe-tag -m probe HEAD
          git -C "${probe}" verify-tag probe-tag
          rm -rf "${probe}"

      # Kept as headroom, not as a fix. The runner image measured 145 GB with
      # ~86 GB already free, so this reclaim currently no-ops. The release gate
      # is still the heaviest consumer in the fleet — it builds the workspace in
      # its own target directory and again in a separate package-check target —
      # and the step costs a second, so it stays ahead of that growth. See the
      # footprint measurement after the harness for the number it guards.
      - uses: burin-labs/harn/.github/actions/free-disk-space@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      - uses: burin-labs/harn/.github/actions/rust-toolchain@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      # The release audit's `rust-audit` lane runs `make test`, which uses
      # nextest when it is installed and otherwise falls back to `cargo test
      # --workspace`. Those two runners do not just differ in coverage — they
      # differ in isolation. nextest runs one process per test; cargo test runs
      # tests as threads in one process, so a test that sets a process-global
      # env var (`TMPDIR` in the harn-hostlib command-artifact tests) leaks into
      # whatever runs beside it. Without nextest this job failed on
      # `completed_artifacts_from_a_live_foreign_pid_do_not_starve_fresh_output`
      # and `cancel_handle_can_wait_for_timed_out_result`, neither of which is
      # broken under the runner harn's own CI uses.
      #
      # Pinned to the version ci.yml installs, so the release gate and CI agree
      # on what "the tests pass" means.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: nextest@0.9.132

      # `release_gate.sh` greps with ripgrep in the security/trust boundary
      # audit, which is not on the hosted runner image — the lane exits 127 on
      # `rg: command not found`. ci.yml installs it the same way for the lane
      # that runs the same scripts.
      - name: Install release-gate script dependencies
        uses: burin-labs/harn/.github/actions/apt-install@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
        timeout-minutes: 5
        with:
          packages: ripgrep
          check-command: rg

      # sccache is deliberately absent. `release_prepare_env` exports
      # `RUSTC_WRAPPER= SCCACHE_DISABLE=1` into every release build, so an
      # installed sccache records `compile_requests: 0` and only makes the job
      # look cached when it is not.
      #
      # Expect this cache to restore dependencies and nothing else, and expect
      # that to stay true here even after issue #656 closes. #672 already gave a
      # lane-owning release a stable workspace path, which is what #656 asked
      # for; a live release on this runner takes that path. It buys nothing on a
      # hosted runner, because Cargo fingerprints a source file by mtime and the
      # worktree is created fresh on a new machine every run. Every workspace
      # crate therefore looks newer than any artifact restored from the cache.
      # Only a surviving checkout switched to a new pin leaves untouched files
      # untouched, and nothing survives here. The ~3m20s `release-cli-aot`
      # spends on 19 workspace crates is not reachable from a cache at all —
      # only from caching the worktree with its mtimes, which this does not do.
      #
      # `workspaces` fixes the cache *key*, which is computed from a Cargo.lock
      # and would otherwise be read from the checkout root — the fleet repo,
      # which has none. `target-dir` names the directory the harness actually
      # compiles into; without it Swatinem caches `harn/target`, which this job
      # never writes. Both inputs arrived in burin-labs/harn#6112.
      - uses: burin-labs/harn/.github/actions/rust-cache@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
        continue-on-error: true
        with:
          shared-key: hosted-release
          workspaces: harn
          target-dir: ~/.cache/harn-bump-fleet/release-harn-target
          save: "true"
          # A release that fails after compiling still warmed the dependencies,
          # and most of this job's history is failed runs.
          cache-on-failure: "true"

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092
        with:
          version-file: harn-bump-fleet/.harn-version

      - name: Install Harn dependencies
        working-directory: harn-bump-fleet
        run: harn install --locked

      # Inputs cross into the shell as environment values, never as
      # interpolated command text.
      #
      # The Cargo target directory is deliberately left at its default. The
      # knob is now HARN_EXT_RELEASE_CARGO_TARGET_DIR (issue #636 moved the
      # harness's own names into the HARN_EXT_ namespace, so it is no longer
      # rejected at startup the way HARN_RELEASE_CARGO_TARGET_DIR was), but
      # the runner's HOME-derived default is ephemeral anyway, so there is
      # nothing to gain by pointing it elsewhere.
      - name: Run release harness
        id: release
        working-directory: harn-bump-fleet
        env:
          # Deliberately omit GH_TOKEN. A process-env token is pinned for the
          # whole `harn run` and cannot be refreshed; ship-pr 31073336444 died
          # at tag push ~68m in with "Invalid username or token" after the
          # App installation mint expired (1h). The connector falls back to
          # `gh auth token`, and git push uses the credential.helper store —
          # both rewritten by scripts/refresh_hosted_release_credentials.sh.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_AT_SHA: ${{ inputs.at_sha }}
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_AT_SHA}" ] && ! printf '%s' "${RELEASE_AT_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "at_sha must be a full 40-character lowercase commit SHA" >&2
            exit 2
          fi

          refresher=""
          if [ "${RELEASE_MODE}" = "ship-pr" ]; then
            # Remint before the App token's 1h ceiling. Certification alone is
            # often ~40m; the tag push lands after that. Prove the remint path
            # once up front so a broken mint fails before the long audit.
            ./scripts/refresh_hosted_release_credentials.sh
            (
              while true; do
                sleep 2400
                ./scripts/refresh_hosted_release_credentials.sh \
                  || echo "::warning::credential refresh failed; next git/API call may auth-fail"
              done
            ) &
            refresher=$!
            trap 'kill "${refresher}" 2>/dev/null || true' EXIT
          fi

          # `--github-signed-commit`: the committer here is an App bot, and
          # GitHub cannot attribute a signing key to one. See the header.
          args=(--repo "${GITHUB_WORKSPACE}/harn" --bump "${RELEASE_BUMP}" --mode "${RELEASE_MODE}" --agent --no-chat --github-signed-commit)
          # Only a mutating mode carries the live-release acknowledgement.
          if [ "${RELEASE_MODE}" != "audit" ]; then
            args+=(--yes-live-release)
          fi
          if [ -n "${RELEASE_AT_SHA}" ]; then
            args+=(--at-sha "${RELEASE_AT_SHA}")
          fi

          harn run --no-sandbox release_harn.harn -- "${args[@]}" | tee hosted-release.md

      # A warm Rust cache is the only lever left on this job's wall clock that
      # costs nothing, and GitHub caps a repository at 10 GB. Whether the
      # release build fits under that cap is a question about this workspace on
      # this runner, so measure it here rather than extrapolate from a
      # developer machine whose target directory has accumulated across runs.
      - name: Measure release build footprint
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Release build footprint'
            echo
            echo "cores: $(nproc)"
            echo
            echo '```'
            du -sh "${HOME}/.cache/harn-bump-fleet"/* 2>/dev/null || echo 'no release target directory'
            du -sh "${HOME}/.cargo/registry" "${HOME}/.cargo/git" 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish run summary
        if: always()
        working-directory: harn-bump-fleet
        run: |
          set -euo pipefail
          if [ -f hosted-release.md ]; then
            cat hosted-release.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # The event stream and live logs are the durable record of why a step
      # failed; they are the first thing an operator reads on a red run.
      #
      # `include-hidden-files` is load-bearing, not hygiene. The run directory
      # is `.harn-runs`, and upload-artifact has skipped dot-prefixed paths by
      # default since v4.4. Run 30824705839 failed after 40 minutes and shipped
      # an artifact containing only `hosted-release.md`: every lane log and the
      # event stream were silently dropped, and `if-no-files-found: warn` had
      # nothing to warn about because one file did match.
      - name: Upload release run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-run-${{ github.run_id }}
          include-hidden-files: true
          path: |
            harn-bump-fleet/.harn-runs/**
            harn-bump-fleet/hosted-release.md
          retention-days: 14
          if-no-files-found: warn
