name: Hosted harn release

# Runs release_harn.harn on a GitHub-hosted runner instead of an operator
# laptop. Both burin-labs/harn and burin-labs/harn-bump-fleet are public, so
# the runner minutes are free, and the ~17 minutes of Rust compilation that
# dominate a local release (prepare + release-cli-aot) move off the operator
# machine entirely.
#
# Tags are signed by a dedicated release bot key held only in this workflow's
# `release` environment. The maintainer's personal key is deliberately not
# reachable from any runner. The trade is provenance: tags now carry the bot's
# identity rather than the maintainer's, and because the tagger is a GitHub App
# bot — which cannot hold SSH signing keys on GitHub — the web UI shows them as
# unverified. The signature is real and anyone can check it from this repo:
#
#   git -c gpg.ssh.allowedSignersFile=.github/release-bot-allowed-signers \
#     verify-tag v<version>
#
# Restoring the green badge would mean signing as a machine user account
# instead of the App bot.
#
# Secret exposure controls, in layers, because both repos are public:
#
#   1. `workflow_dispatch` is the only trigger. GitHub restricts manual
#      dispatch to actors with write access, so no fork, pull request, or
#      outside contributor can start this run.
#   2. The job binds to the `release` environment. Its protection rules
#      (required reviewers, `main`-only deployment branches) gate the secrets:
#      the job pauses before any secret is materialized until a reviewer
#      approves, so even a write-access collaborator cannot spend the API key
#      unattended.
#   3. Top-level `permissions` is read-only. Write access to burin-labs/harn
#      comes from a separately scoped, short-lived GitHub App token.
#   4. Free-text inputs never reach a shell as interpolated text; they cross
#      into `run:` blocks through the environment so a crafted value cannot
#      escape into the command line.
#   5. Every third-party action is pinned by commit SHA.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for the next release.
        type: choice
        options: [patch, minor, major]
        default: patch
      mode:
        description: >-
          audit is read-only. prepare builds and certifies the candidate and
          stops before the tag. ship-pr signs and pushes the tag, then opens
          the release PR.
        type: choice
        options: [audit, prepare, ship-pr]
        default: audit
      at_sha:
        description: >-
          Optional 40-character base pin. Blank pins the release at
          origin/main when the run starts.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hosted-harn-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.mode }} v-next (${{ inputs.bump }})
    runs-on: ubuntu-latest
    # A cold-cache prepare compiles the workspace twice over (the release gate's
    # own target directory plus the separate package-check target) on a 4-core
    # runner, where the same lanes take ~30 minutes on a 12-core laptop. The
    # ceiling exists to stop a wedged run, not to bound a slow one.
    timeout-minutes: 300
    environment: release

    steps:
      - name: Check out release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harn-bump-fleet
          persist-credentials: false

      # Scoped to burin-labs/harn only. `audit` never writes, but the same
      # token serves both modes so the checkout remote is uniform; the
      # harness itself is what decides whether a write happens.
      - name: Mint scoped release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          repositories: harn
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      # Full history: the harness reconciles tags, walks commit evidence back
      # to the previous release, and adds a release worktree.
      - name: Check out harn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/harn
          path: harn
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The release gate creates the tag with `git tag -s` and then gates on
      # `git verify-tag`, so the runner needs both halves of an identity: a
      # private key to sign with, and an allowed-signers file to verify
      # against. The key is the release bot's own, never the maintainer's —
      # a personal signing key must not be reachable from a runner.
      #
      # The tagger is a GitHub App bot, and an App bot cannot hold SSH signing
      # keys on GitHub, so GitHub's web UI will show these tags as unverified.
      # The signature is real and checkable by anyone from this repository:
      # `git -c gpg.ssh.allowedSignersFile=.github/release-bot-allowed-signers
      # verify-tag v<version>`. Moving the badge back would mean signing as a
      # machine user account instead of the App bot.
      - name: Identify and arm the release signer
        working-directory: harn
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          ALLOWED_SIGNERS: ${{ github.workspace }}/harn-bump-fleet/.github/release-bot-allowed-signers
        run: |
          set -euo pipefail

          git config user.name "harn-release-bot[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          # RUNNER_TEMP is outside both checkouts, so the key cannot be picked
          # up by a status check, an archive step, or a stray `git add -A`.
          key_path="${RUNNER_TEMP}/release-signing-key"
          umask 077
          printf '%s\n' "${RELEASE_SIGNING_KEY}" > "${key_path}"
          chmod 600 "${key_path}"

          git config gpg.format ssh
          git config user.signingkey "${key_path}"
          git config gpg.ssh.allowedSignersFile "${ALLOWED_SIGNERS}"

          # Prove the identity round-trips before spending a release on it.
          # Signing that silently fails would otherwise surface hours later,
          # at the one step the whole run exists to reach.
          probe="${RUNNER_TEMP}/signing-probe"
          rm -rf "${probe}" && mkdir -p "${probe}"
          git -C "${probe}" init -q
          git -C "${probe}" config user.name "harn-release-bot[bot]"
          git -C "${probe}" config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git -C "${probe}" config gpg.format ssh
          git -C "${probe}" config user.signingkey "${key_path}"
          git -C "${probe}" config gpg.ssh.allowedSignersFile "${ALLOWED_SIGNERS}"
          git -C "${probe}" commit -q --allow-empty -m probe
          git -C "${probe}" tag -s probe-tag -m probe HEAD
          git -C "${probe}" verify-tag probe-tag
          rm -rf "${probe}"

      # harn's own Rust lanes all take this reclaim, and the release gate is
      # heavier than any one of them: it builds the workspace in its own target
      # directory and again in a separate package-check target. The hosted
      # image's ~14 GB of free root space does not survive that without first
      # dropping the ~30 GB of preinstalled SDKs the build never touches.
      - uses: burin-labs/harn/.github/actions/free-disk-space@cf52e20564cb722f2f060bc222fa79d996cd3c30

      - uses: burin-labs/harn/.github/actions/rust-toolchain@cf52e20564cb722f2f060bc222fa79d996cd3c30
      - uses: burin-labs/harn/.github/actions/sccache-install@cf52e20564cb722f2f060bc222fa79d996cd3c30
        continue-on-error: true
      - uses: burin-labs/harn/.github/actions/rust-cache@cf52e20564cb722f2f060bc222fa79d996cd3c30
        continue-on-error: true

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@cf52e20564cb722f2f060bc222fa79d996cd3c30
        with:
          version-file: harn-bump-fleet/.harn-version

      - name: Install Harn dependencies
        working-directory: harn-bump-fleet
        run: harn install --locked

      # Inputs cross into the shell as environment values, never as
      # interpolated command text.
      #
      # The Cargo target directory is deliberately left at its default. Harn
      # validates every HARN_-prefixed name at startup and rejects the
      # harness's own HARN_RELEASE_CARGO_TARGET_DIR, so setting it aborts the
      # run before the harness reads it. See issue #636; the runner's
      # HOME-derived default is ephemeral anyway.
      - name: Run release harness
        id: release
        working-directory: harn-bump-fleet
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_AT_SHA: ${{ inputs.at_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_AT_SHA}" ] && ! printf '%s' "${RELEASE_AT_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "at_sha must be a full 40-character lowercase commit SHA" >&2
            exit 2
          fi

          args=(--repo "${GITHUB_WORKSPACE}/harn" --bump "${RELEASE_BUMP}" --mode "${RELEASE_MODE}" --agent --no-chat)
          # Only a mutating mode carries the live-release acknowledgement.
          if [ "${RELEASE_MODE}" != "audit" ]; then
            args+=(--yes-live-release)
          fi
          if [ -n "${RELEASE_AT_SHA}" ]; then
            args+=(--at-sha "${RELEASE_AT_SHA}")
          fi

          harn run --no-sandbox release_harn.harn -- "${args[@]}" | tee hosted-release.md

      - name: Publish run summary
        if: always()
        working-directory: harn-bump-fleet
        run: |
          set -euo pipefail
          if [ -f hosted-release.md ]; then
            cat hosted-release.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # The event stream and live logs are the durable record of why a step
      # failed; they are the first thing an operator reads on a red run.
      - name: Upload release run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-run-${{ github.run_id }}
          path: |
            harn-bump-fleet/.harn-runs/**
            harn-bump-fleet/hosted-release.md
          retention-days: 14
          if-no-files-found: warn
