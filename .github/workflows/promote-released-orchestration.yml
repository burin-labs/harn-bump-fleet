name: Promote Released Orchestration

# A Harn release starts this through its `repin` job (burin-labs/.github's
# release-consumers.json names this workflow as burin-labs/harn's consumer).
#
# Every consumer's bump runs the driver from the orchestration commit
# `fleet.toml` pins, and the release that just published may have changed the
# contract that driver implements. So the release never dispatches consumer
# bumps directly. This promotes the pin to the released commit and stops; the
# rest is event-driven:
#
#   1. this run lands the `fleet.toml` and fleet-adapter projection here;
#   2. that push starts fleet-projection-convergence.yml, which proposes each
#      consumer's adapter at the new pin with auto-merge armed;
#   3. each adapter's landing on its default branch starts that consumer's
#      bump (the generated adapter runs its `bump` job on that push).
#
# A consumer therefore cannot bump to a release through an older orchestration
# contract, and no job here waits on thirty merge queues.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact published Harn tag (vX.Y.Z) whose commit becomes the orchestration pin."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-released-orchestration
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint fleet GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: write
          permission-pull-requests: write
          # The promotion rewrites this repository's own bump adapter.
          permission-workflows: write

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@4bb2bb878cfa985904e53b6675791f1fa6acf8c5

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Resolve the released commit
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be an exact vX.Y.Z tag, got '$VERSION'"
            exit 2
          fi
          # Only a published, non-draft release may move the pin.
          state="$(gh release view "$VERSION" --repo burin-labs/harn --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "$state" != "false false" ]]; then
            echo "::error::$VERSION is not a published stable release (draft prerelease: $state)"
            exit 1
          fi
          commit="$(gh api "repos/burin-labs/harn/commits/$VERSION" --jq .sha)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve $VERSION to a commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Promote the orchestration pin
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          # Controller scope only: consumers converge from the push this lands.
          harn run --no-sandbox promote_bump_workflow.harn -- "$COMMIT" \
            --repositories-json '["burin-labs/harn-bump-fleet"]' \
            --timeout-s 2700 \
            | tee promotion-receipt.json

      - name: Upload promotion receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promote-released-orchestration
          path: promotion-receipt.json
          if-no-files-found: warn
