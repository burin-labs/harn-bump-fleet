name: Check fleet pin ancestry

# Each repository's own CI can refuse a new pin to a commit off the default
# branch, but a pin that was fine when it merged goes stale when its branch is
# deleted and the commit stops being a branch head. This daily read of every
# fleet repository's default branch names those pins before a caller goes red.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 14 * * *"

permissions:
  contents: read

concurrency:
  group: check-fleet-pin-ancestry
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint read-only fleet token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: read

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@6b541c0b50fb9c5dfab994ecb118ee1ea6004b44

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Check every fleet pin
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: harn run --no-sandbox check_pin_ancestry.harn -- --fleet | tee pin-ancestry-receipt.json

      - name: Upload pin ancestry receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-bump-fleet-pin-ancestry
          path: pin-ancestry-receipt.json
          if-no-files-found: error
