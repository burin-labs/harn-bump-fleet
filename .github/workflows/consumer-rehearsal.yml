name: Consumer rehearsal

# Ask the consumer question on a cadence instead of at the tag.
#
# The consumer pre-tag gate is the last step a release runs and the first one
# that fails, because it is the only step that asks about repositories nobody
# touched since the previous cut. The v0.10.133 tail died that way: eight
# minutes in, on one consumer whose bump workflow bytes had drifted from the
# fleet-owned projection weeks earlier.
#
# This runs the same gates against the Harn default branch, so that drift
# surfaces as a red rehearsal on the day it lands rather than as a failed
# release. The evidence is one revision- and contract-bound proof ref per
# consumer. `lib/consumer_rehearsal.harn` owns both recording those refs after
# a gate verdict and reading them during release preflight, so there is one
# policy rather than a workflow-run inference beside a separate receipt store.
#
# A tick is change-gated, not time-gated. It lists the proofs already recorded
# for the current Harn default-branch revision and dispatches gates only for the
# consumers missing one, so an unchanged fleet costs a single ref listing rather
# than thirty-two runtime builds. The hourly cadence is therefore cheap enough
# to leave running while the Harn-side dispatch on merge is still to come.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional owner/repo target; rehearse just this consumer."
        required: false
        type: string
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

# Never two at once. Each gate is a full runtime build on the consumer's
# largest runner class, so an overlapping pair does not just cost twice -- it
# also leaves two rehearsals of the same revision disagreeing about who the
# record is.
concurrency:
  group: consumer-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches with the checkout's own credential,
          # and a persisted one leaves an `include.path` in .git/config pointing
          # at a $RUNNER_TEMP file that later sandboxed steps cannot read.
          persist-credentials: false

      # Actions write dispatches each consumer's gate workflow and reads its run
      # back. Contents write records the proof: one ref per consumer per Harn
      # revision under refs/heads/rehearsal-proved/, claimed once, which is what
      # lets the next tick skip an unchanged fleet and lets a release ask
      # whether the revision it is cutting was already gated. This workflow
      # never commits to a branch, never opens a pull request, and never writes
      # an issue.
      - name: Mint fleet GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-actions: write
          permission-contents: write

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@a776aba61473102efdad448e6ae464c944e44af0

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Rehearse the consumer gates against the Harn default branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          harn run --no-sandbox rehearse_consumers.harn -- "${args[@]}" \
            | tee consumer-rehearsal-receipt.txt

      # Uploaded on failure too: a red rehearsal is the expected outcome of
      # finding a drifted consumer, and the receipt names which one.
      - name: Upload rehearsal receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-rehearsal-receipt
          path: consumer-rehearsal-receipt.txt
          if-no-files-found: error
