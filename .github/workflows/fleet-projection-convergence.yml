name: Converge Fleet Projections

# The repair half of fleet projection policy. `check_fleet_policy.harn` reports
# that a fleet-owned file has drifted from `fleet.toml`; this restores it.
#
# Every repair is a pull request on one stable branch per repository. Nothing
# here writes a default branch, and nothing here merges: each repository keeps
# its own gate, so a projection that cannot pass review is a manifest problem
# and not something to force past it.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Open pull requests for drift. Unset to report only."
        required: false
        default: true
        type: boolean
      only:
        description: "Optional owner/repo target."
        required: false
        type: string
  schedule:
    - cron: "13 7 * * *"

permissions:
  contents: read

concurrency:
  group: converge-fleet-projections
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The manifest this run renders from is the one it just checked out, and
      # what it compares against is every other repository's default branch. A
      # run from a stale tree would therefore propose reverting a manifest
      # change that has already landed. Scheduled runs check out the default
      # branch, which is the only tree that cannot be behind.
      - name: Mint fleet GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: write
          permission-pull-requests: write
          # GitHub App installation tokens need the distinct Workflows
          # permission when the commit includes `.github/workflows/*`. The
          # fleet-owned bump adapter is one of this job's typed projection
          # targets, so omitting this scope makes convergence fail by design.
          permission-workflows: write

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Converge fleet-owned projections
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
          ONLY: ${{ inputs.only }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          else
            args+=(--check)
          fi
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          harn run --no-sandbox converge_fleet_projections.harn -- "${args[@]}" \
            | tee fleet-convergence-receipt.json

      - name: Upload convergence receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-bump-fleet-convergence
          path: fleet-convergence-receipt.json
          if-no-files-found: error
