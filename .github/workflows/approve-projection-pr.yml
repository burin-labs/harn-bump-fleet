name: Approve projection PR

# Approves the release bot's orchestration-pin projection pull request once
# scripts/approve_projection_pr.sh has proved from the pull request's data that
# it moves only the pin to a published Harn release commit. The bot that opens
# it cannot approve its own pull request, so each release waited for a person
# before Smart Ship would land it. Required checks still apply.
#
# `pull_request_target` runs the copy on main, and the job reads the pull
# request only through the API: it never checks out or runs pull request code.
# The approval is made as github-actions and bound to the head SHA it checked.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out or runs pull request code; it reads the diff through the API
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Projection pull request to check and approve.
        required: true
        type: string

permissions: {}

jobs:
  approve:
    name: Approve pin-only projection PR
    if: >-
      github.repository == 'burin-labs/harn-bump-fleet' && (github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.user.login == 'harn-release-bot[bot]'
      && startsWith(github.event.pull_request.head.ref, 'automation/fleet-projections-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: approve-projection-pr-${{ github.event.pull_request.number || inputs.pull_request }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the diff and approve
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: bash scripts/approve_projection_pr.sh "$PULL_REQUEST"
