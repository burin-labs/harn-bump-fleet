name: Report failed hosted release

# A red hosted release run stops the train until somebody notices it, opens the
# job page, reads the failing step, decides whether the failure is mechanical,
# and reconstructs the dispatch by hand. All four read structured evidence the
# run already has, so this finalizer reads it once and writes what failed,
# whether a re-dispatch is the right answer, and the exact inputs it would
# carry.
#
# It never dispatches anything. The receipt is the product, and the decision
# stays with a person.
on:
  workflow_run:
    workflows: [Hosted harn release]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  report:
    name: Name the failed precondition
    # A release that ran out of the job's five-hour ceiling, or was cancelled
    # part way, leaves exactly the same question as one that failed: what did it
    # get through, and is the release already out. Firing only on `failure`
    # meant the longest and most expensive runs were the ones that left no
    # receipt at all.
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the failure registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@a776aba61473102efdad448e6ae464c944e44af0
        with:
          version-file: .harn-version

      - name: Install locked Harn dependencies
        run: harn install --locked

      # A run that died before recording its inputs leaves nothing to replay.
      # That is data the receipt reports as an escalation, so a missing artifact
      # must not fail this job.
      - name: Download the dispatched release inputs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .harn-runs

      # The preflight receipt names which precondition refused, and the repair a
      # reader is owed depends on that. A run that failed before the preflight
      # wrote one leaves no receipt, which the finalizer reports as no cause
      # named rather than as a preflight that passed, so a missing artifact must
      # not fail this job either.
      - name: Download the release run receipts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-run-${{ github.event.workflow_run.id }}-attempt-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .harn-runs

      - name: Download the legacy release run receipt
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-run-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .harn-runs

      - name: Name what failed and how to retry it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          inputs=()
          mapfile -t input_receipts < <(find .harn-runs -type f -name 'hosted-release-inputs.json' -print | sort -V)
          if [[ "${#input_receipts[@]}" -gt 0 ]]; then
            inputs=(--inputs "${input_receipts[-1]}")
          fi
          preflight=()
          mapfile -t preflight_receipts < <(find .harn-runs -type f -name 'release-launch-preflight.json' -print | sort -V)
          if [[ "${#preflight_receipts[@]}" -gt 0 ]]; then
            preflight=(--preflight-receipt "${preflight_receipts[-1]}")
          fi
          watch_receipt=()
          mapfile -t watches < <(find .harn-runs -type f -path '*/release-harn/watches/v*.json' -print | sort -V)
          if [[ "${#watches[@]}" -gt 0 ]]; then
            watch_receipt=(--watch-receipt "${watches[-1]}")
          fi
          harn run --no-sandbox report_failed_hosted_release.harn -- \
            --run-id "${RUN_ID}" \
            --summary-out "${GITHUB_STEP_SUMMARY}" \
            "${inputs[@]}" \
            "${preflight[@]}" \
            "${watch_receipt[@]}"
        shell: bash

      - name: Upload the failure receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-release-failure-${{ github.event.workflow_run.id }}
          include-hidden-files: true
          path: .harn-runs/hosted-release-failure.json
          retention-days: 14
          if-no-files-found: error
