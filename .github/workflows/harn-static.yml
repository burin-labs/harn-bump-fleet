name: Harn static checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harn-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache Cargo
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: harn-static

      - name: Install pinned Harn
        shell: bash
        run: |
          set -euo pipefail
          HARN_INSTALL_ROOT="${RUNNER_TEMP}/harn" bash scripts/install_harn.sh

      - name: Show Harn version
        run: harn version

      - name: Install Harn dependencies
        run: harn install --locked

      - name: Check Harn scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t harn_files < <(git ls-files '*.harn')
          if (( ${#harn_files[@]} == 0 )); then
            echo "No .harn files found."
            exit 0
          fi
          harn check --strict-types "${harn_files[@]}"
          harn fmt --check "${harn_files[@]}"
          harn lint --strict "${harn_files[@]}"
          harn run --no-sandbox check_source_length.harn
          if [ -d tests ]; then
            harn test tests/ --parallel --verbose
          fi

      - name: Mock end-to-end release flow
        shell: bash
        run: |
          set -euo pipefail
          # Exercises the full release_harn control flow with a mock provider and
          # no repo side effects.
          harn run --no-sandbox release_harn.harn -- --mock --agent --mode ship-pr

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs: [harn-static]
    steps:
      - name: Verify required CI jobs
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.harn-static.result }}"
          echo "Harn static checks / harn-static: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Harn static checks failed."
            exit 1
          fi
