name: Harn static checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harn-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Harn binary
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .harn-version)"
          target="x86_64-unknown-linux-gnu"
          url="https://github.com/burin-labs/harn/releases/download/${version}/harn-${target}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" -o /tmp/harn.tar.gz
          tar -xzf /tmp/harn.tar.gz -C "$HOME/.local/bin" harn
          chmod +x "$HOME/.local/bin/harn"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Harn version
        run: harn version

      - name: Check Harn scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t harn_files < <(git ls-files '*.harn')
          if (( ${#harn_files[@]} == 0 )); then
            echo "No .harn files found."
            exit 0
          fi
          harn check "${harn_files[@]}"
          harn fmt --check "${harn_files[@]}"
          harn lint "${harn_files[@]}"
