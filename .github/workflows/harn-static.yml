name: Harn static checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harn-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo
        if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: harn-static

      - name: Install pinned Harn
        shell: bash
        run: |
          set -euo pipefail
          HARN_INSTALL_ROOT="${RUNNER_TEMP}/harn" bash scripts/install_harn.sh

      - name: Show Harn version
        run: harn version

      - name: Install Harn dependencies
        run: harn install --locked

      - name: Check Harn scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t harn_files < <(git ls-files '*.harn')
          if (( ${#harn_files[@]} == 0 )); then
            echo "No .harn files found."
            exit 0
          fi
          harn check "${harn_files[@]}"
          harn fmt --check "${harn_files[@]}"
          harn lint "${harn_files[@]}"
          if [ -d tests ]; then
            harn test tests/ --verbose
          fi

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs: [harn-static]
    steps:
      - name: Verify required CI jobs
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.harn-static.result }}"
          echo "Harn static checks / harn-static: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Harn static checks failed."
            exit 1
          fi
