name: Temporary Smart Ship bootstrap for fleet PR 1503

# This branch-only workflow calls the normal shared Smart Ship loop. The
# existing default-branch workflow with this filename enables manual dispatch;
# the default-branch audit and its schedule are not changed.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: The reviewed release-lease pull request
        type: string
        required: true

permissions:
  contents: read

jobs:
  ship:
    if: inputs.pr == '1503' && github.repository == 'burin-labs/harn-bump-fleet'
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@49dd60d76ff2787394bd24e4c37e3ca997060fc5
    with:
      repair: false
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
