name: Check branches without pull requests

# Remote branches are durable work, but they can outlive the task or session
# that created them. This read-only audit makes each unreviewed branch visible
# in its owning repository without deciding whether to delete it.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional exact owner/repository target."
        required: false
        type: string
      dry_run:
        description: "Report without opening, refreshing, or closing issues."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

concurrency:
  group: check-prless-branches
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint branch audit token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Audit fleet branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--run-url "$RUN_URL")
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          harn run --no-sandbox check_prless_branches.harn -- "${args[@]}" \
            | tee prless-branch-audit-receipt.json

      - name: Upload branch audit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-bump-fleet-prless-branch-audit
          path: prless-branch-audit-receipt.json
          if-no-files-found: error
