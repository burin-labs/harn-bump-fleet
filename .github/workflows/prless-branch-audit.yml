name: Check branches without pull requests

# Report the complete census without turning ongoing work into cleanup tasks.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional exact owner/repository target."
        required: false
        type: string
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: read

concurrency:
  group: check-prless-branches
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint branch audit token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: read
          permission-pull-requests: read

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@6b541c0b50fb9c5dfab994ecb118ee1ea6004b44

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Audit fleet branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ONLY: ${{ inputs.only }}
          # Machine names redacted from every published branch name. A repository
          # secret, not an org one: a private org secret reads as unset here.
          FLEET_PRIVATE_HOST_NAMES: ${{ secrets.FLEET_PRIVATE_HOST_NAMES }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          harn run --no-sandbox check_prless_branches.harn -- "${args[@]}" \
            | tee prless-branch-audit-receipt.json

      - name: Upload branch audit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harn-bump-fleet-prless-branch-audit
          path: prless-branch-audit-receipt.json
          if-no-files-found: error
