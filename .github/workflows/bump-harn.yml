# Bump Harn Runtime — thin caller of the reusable workflow (harn#5299).
#
# Replaces the ~292L copied shell/YAML state machine with a trigger wrapper that
# calls burin-labs/harn's published `workflow_call` workflow. All orchestration
# (pin resolve, readiness gate, lockfile refresh, signed commit, PR + auto-merge)
# lives in Harn (`std/bump/runtime`/`std/bump/live`), not here. The only
# repo-specific parts are the schedule and the single validate-command.
#
# `workflow_dispatch:` at exactly two-space indentation is load-bearing:
# `lib/bump_fleet_pre_dispatch.harn` decides whether a repo is fleet-bumpable
# with a literal `contains(source, "\n  workflow_dispatch:")` test, so this repo
# keeps discovering and dispatching itself like any other fleet member.
name: Bump Harn Runtime
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional Harn tag (vX.Y.Z). Defaults to latest release."
        required: false
        type: string
  schedule:
    - cron: "43 9 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    # PIN: v0.10.34 release commit of burin-labs/harn.
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@e9e1ac66009672132267261a47cdcd19705e40f1
    with:
      version: ${{ inputs.version }}
      # This repo's single declared validation entrypoint. Runs after the pin +
      # lockfile refresh; non-zero exit blocks the commit. POSIX-sh only — the
      # runtime executes this through the host default shell (std/command shell
      # mode), which on a runner may resolve to /bin/sh (dash), not bash. No
      # bash-only builtins or arithmetic-command syntax: keep this portable
      # regardless of runner shell. The previous hand-rolled workflow used bash
      # array reads here; this is the POSIX rewrite of the same intent, and
      # tests/bump_workflow.harn asserts the bashisms stay gone.
      #
      # Mirrors `.github/workflows/harn-static.yml`, which is a strictly
      # stronger gate than the old bump workflow ran: `--strict-types` on check,
      # `--strict` on lint, and the source-length budget, none of which the
      # previous bump step applied.
      #
      # Deviation from harn-static.yml, deliberate: it runs `harn fmt --check`
      # because it verifies a PR; here `harn fmt` REWRITES, so a formatter
      # change in the new runtime lands in the bump commit and the PR's own
      # harn-static `--check` then passes. Verifying here would instead wedge
      # the daily bump permanently on any formatter change.
      validate-command: |
        set -eu
        files=$(git ls-files '*.harn')
        if [ -n "$files" ]; then
          # Word-splitting on $files is intentional: pass every .harn path as a
          # separate arg. Fleet .harn paths never contain whitespace.
          harn fmt $files
          harn check --strict-types $files
          harn lint --strict $files
        fi
        harn run --no-sandbox check_source_length.harn
        if [ -d tests ]; then
          harn test tests/ --parallel --verbose
        fi
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
