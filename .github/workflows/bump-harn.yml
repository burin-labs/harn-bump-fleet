name: Bump Harn Runtime

# fleet.toml in harn-bump-fleet owns this generated dispatch adapter.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@58c839237c774849f65eacd401b1f783d3dab033
    with:
      version: ${{ inputs.version }}
      validate-command: |-
        set -eu
        scripts/harn-project.sh --tracked-only format
        harn package verify . --strict
        harn run --no-sandbox check_source_length.harn
        harn test tests-risky --approve-risky git.push
      publish-failure-for-repair: true
      apply-behavior-preserving-fixes: false
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
