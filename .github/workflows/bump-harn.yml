name: Bump Harn Runtime

# fleet.toml in harn-bump-fleet owns the schedule and dispatches this adapter.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@b1bf5bc89a93ee22b9cf9b5fef60f1a609352620
    with:
      version: ${{ inputs.version }}
      validate-command: |
        set -eu
        scripts/harn-project.sh --tracked-only format
        scripts/harn-project.sh --tracked-only verify
        harn run --no-sandbox check_source_length.harn
        harn test tests/ --parallel
        harn test tests-risky/release_ref_cleanup_git_push.harn --approve-risky git.push
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
