name: Bump Harn Runtime

# fleet.toml in harn-bump-fleet owns the schedule and dispatches this adapter.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@7313a4bd8fe95b93239971457513a5adb6d46fcd
    with:
      version: ${{ inputs.version }}
      validate-command: |
        set -eu
        files=$(git ls-files '*.harn')
        if [ -n "$files" ]; then
          # Word-splitting is intentional: tracked Harn paths cannot contain
          # newlines and each path must remain a separate CLI argument.
          harn fmt $files
          harn check --strict-types $files
          harn lint --strict $files
        fi
        harn run --no-sandbox check_source_length.harn
        harn test tests/ --parallel
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
