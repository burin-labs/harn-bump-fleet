name: Release launch preflight

# Ask every release precondition against live state, apart from a release.
#
# Two of these preconditions can go bad with no commit in this repository: the
# App mint the cut is armed from, and the consumer contracts publication
# compares against. An hourly run is what turns "the release found out at the
# cut" into "main found out an hour ago".
#
# CI calls this on every pull request and every push to main. It lives in its
# own file because the organization's package policy requires ci.yml's status
# roll-up to run with a bare `if: always()`, which leaves no way to hold the
# heavy jobs out of a scheduled tick from inside ci.yml.

on:
  workflow_call:
    inputs:
      mode:
        description: Release mode whose preconditions to ask about.
        type: string
        default: ship-pr
      scope:
        description: >-
          Whose failure refuses. `release` refuses on every precondition.
          `repository` refuses only on what a commit in this repository could
          repair, and announces the rest without failing the job.
        type: string
        default: release
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode whose preconditions to ask about.
        type: choice
        options: [audit, prepare, ship-pr]
        default: ship-pr
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  # A called workflow inherits the caller's workflow identity. Keep CI's
  # preflight separate from the hourly standalone probe so a delayed schedule
  # cannot cancel a required main-branch check that is already running.
  group: release-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Release launch preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately not `environment: release`. That environment is restricted to
    # protected branches, so a pull request could not enter it at all, and the
    # App credentials this job needs are organization secrets rather than
    # environment ones. The signing key, which is environment-scoped, is not a
    # release precondition this job can or should ask about.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@a776aba61473102efdad448e6ae464c944e44af0
      - name: Install locked dependencies
        run: harn install --locked

      # A pull request from a fork gets no secrets. That must not read as a
      # clean preflight, and it must not read as a broken one either: the run
      # below drops to --offline, which asks every structural precondition for
      # real and reports the credentialed ones as not asked.
      - name: Resolve whether this context holds release credentials
        id: credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_APP_CLIENT_ID}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint fleet policy read token
        if: steps.credentials.outputs.available == 'true'
        id: fleet-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: read

      - name: Ask every release precondition
        env:
          CREDENTIALS_AVAILABLE: ${{ steps.credentials.outputs.available }}
          RELEASE_MODE: ${{ inputs.mode || 'ship-pr' }}
          RELEASE_SCOPE: ${{ inputs.scope || 'release' }}
          GH_TOKEN: ${{ steps.fleet-policy-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.fleet-policy-token.outputs.token }}
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .harn-runs
          args=(--mode "${RELEASE_MODE}" --bump patch --scope "${RELEASE_SCOPE}")
          if [ "${CREDENTIALS_AVAILABLE}" != "true" ]; then
            args+=(--offline)
          fi
          ./scripts/preflight_release_launch.sh "${args[@]}" \
            --receipt .harn-runs/release-launch-preflight.json

      - name: Upload the preflight receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-launch-preflight
          path: .harn-runs/release-launch-preflight.json
          if-no-files-found: warn
