name: Check Fleet Pin Staleness

# The alarm for a bump pipeline that stops landing.
#
# Every other signal here reports on a run that happened: a red workflow, a
# receipt, a closed pull request. None of them fire when the pipeline simply
# stops producing anything, which is how a consumer reached four releases
# behind with failed bump runs and no page. This asks the one question that
# catches all of those shapes at once — is each consumer on the newest release
# — and files one issue per repository that is not.
#
# It runs after the daily fleet bump (09:43 UTC) so a release published
# overnight has had its adoption attempt before this judges the result.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional owner/repo target."
        required: false
        type: string
      max_releases_behind:
        description: "Releases a consumer may trail before alarming."
        required: false
        default: "1"
        type: string
      dry_run:
        description: "Report without opening, refreshing, or closing issues."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 11 * * *"

permissions:
  contents: read

concurrency:
  group: check-fleet-pin-staleness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Issues write is the only scope beyond reading pins: this workflow never
      # commits, never opens a pull request, and never dispatches anything.
      - name: Mint fleet GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Check every consumer pin against the newest release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ONLY: ${{ inputs.only }}
          MAX_BEHIND: ${{ inputs.max_releases_behind || '1' }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--max-releases-behind "$MAX_BEHIND" --run-url "$RUN_URL")
          if [[ -n "$ONLY" ]]; then
            args+=(--only "$ONLY")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          harn run --no-sandbox check_fleet_pin_staleness.harn -- "${args[@]}" \
            | tee fleet-pin-staleness-receipt.json

      # The receipt is uploaded even when the check goes red, because a red run
      # here is the expected outcome of finding a stale consumer, not a crash.
      - name: Upload staleness receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-bump-fleet-pin-staleness
          path: fleet-pin-staleness-receipt.json
          if-no-files-found: error
