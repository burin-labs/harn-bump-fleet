name: Check Fleet Pin Staleness Heartbeat

# The watchdog for the pin-staleness alarm.
#
# fleet-pin-staleness.yml is the durable page for a bump pipeline that stops
# landing. It is itself a scheduled workflow, so a disabled cron, a token that
# lost `issues: write`, or a broken `harn install` returns the fleet to the
# pre-#975 silence and nothing says so. This workflow is a separate file on
# purpose: the alarm cannot mark itself alive.
#
# It asks one question — has fleet-pin-staleness.yml completed successfully
# inside the allowed age — and files one self-closing issue when the answer
# is no. It runs after the 11:37 UTC alarm so the same day's pulse is visible.

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Days a successful pin-staleness run may be before alarming."
        required: false
        default: "2"
        type: string
      dry_run:
        description: "Report without opening, refreshing, or closing the heartbeat issue."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 13 * * *"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: check-fleet-pin-staleness-heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes or fetches with the checkout's own
          # credential, and a persisted one leaves an `include.path` in
          # .git/config pointing at a $RUNNER_TEMP file. Git treats an
          # unreadable include as fatal, so any later step that reads git
          # from a different temp root or under a sandbox dies on config,
          # not on its own work. Run 30995854515 lost a release to exactly
          # that; the release job has carried this setting ever since.
          persist-credentials: false

      # Same-repo reads and the one heartbeat issue use the workflow token so
      # this check stays up if the fleet App loses `issues: write` — that loss
      # is one of the silences this job exists to make loud.
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e9e3f14e7cd07aa25daa3a0cac55832cc79ea092

      - name: Install locked Harn dependencies
        run: harn install --locked

      - name: Assert the pin-staleness alarm still has a recent successful run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '2' }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --max-age-days "$MAX_AGE_DAYS" --run-url "$RUN_URL")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          harn run --no-sandbox check_fleet_pin_staleness_heartbeat.harn -- "${args[@]}" \
            | tee fleet-pin-staleness-heartbeat-receipt.json

      - name: Upload heartbeat receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-bump-fleet-pin-staleness-heartbeat
          path: fleet-pin-staleness-heartbeat-receipt.json
          if-no-files-found: error
