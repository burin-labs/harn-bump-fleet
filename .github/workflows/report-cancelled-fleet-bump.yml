name: Report cancelled fleet bump

# A concurrency eviction cancels the bump-fleet run before any job starts, so
# that workflow cannot page itself. This sibling fails after the parent is
# terminal cancelled, which GitHub emails like any other red run.

on:
  workflow_run:
    workflows: [Update repositories for a Harn release]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write cancelled-run receipt and fail
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg event "$SOURCE_EVENT" \
            --arg url "$SOURCE_URL" \
            --arg conclusion "$SOURCE_CONCLUSION" \
            '{source_run_id: $source_run_id, event: $event, url: $url, conclusion: $conclusion}' \
            > cancelled-fleet-bump-receipt.json
          exit 1

      - name: Upload cancelled-run receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cancelled-fleet-bump-${{ github.event.workflow_run.id }}
          path: cancelled-fleet-bump-receipt.json
          if-no-files-found: error
