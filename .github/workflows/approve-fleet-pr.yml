name: Approve fleet PR

# Reusable by fleet consumer repositories through their projected Smart Ship
# caller. Approves the release bot's runtime-bump and projection-restore pull
# requests when scripts/approve_projection_pr.sh (APPROVAL_SCOPE=consumer) proves
# from the pull request's data that they touch only the paths in
# scripts/projection-approval-paths.json, are signed by the bot, have green
# checks and no open review thread. The caller pins this file by commit, and the
# script and path policy are checked out at that same commit (`source_ref`), so a
# change to the allowlist reaches a consumer only through a reviewed pin move.
#
# The job reads pull requests only through the API: it never checks out or runs
# pull request code. The approval is made as github-actions and bound to the head
# SHA it checked. A pull request that is not yet eligible is declined with a
# receipt, not a failure.
on:
  workflow_call:
    inputs:
      source_ref:
        description: Full commit of harn-bump-fleet that holds the script and path policy; the caller passes the commit it pins this workflow at.
        required: true
        type: string
      pull_request:
        description: Pull request to check; empty checks every open pull request of the release bot.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  approve:
    name: Approve fleet PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: read
    concurrency:
      group: approve-fleet-pr-${{ github.repository }}-${{ inputs.pull_request || 'sweep' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/harn-bump-fleet
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Check the diffs and approve
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_SCOPE: consumer
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          if [[ -n "$PULL_REQUEST" ]]; then
            prs=$PULL_REQUEST
          else
            prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | select(.user.login == "harn-release-bot[bot]") | .number')
          fi
          for pr in $prs; do
            bash scripts/approve_projection_pr.sh "$pr"
          done
