[package]
name = "harn-bump-fleet"
version = "0.1.0"
description = "Local Harn-version bump orchestrator across ~/projects/{*harn*,*burin*}"
harn = ">=0.10,<0.11"

[asset_roots]
prompts = "prompts"

# Convenience aliases for the empirical best planner/binder cell from PR
# burin-labs/harn#1814. API keys come from the environment (sourced via
# scripts/with_env.sh from ~/projects/burin-code/.env or ./.env.local);
# these aliases only name the route, never the secret.
[llm.aliases]
qwen3_6_local = { id = "qwen3.6:35b-a3b-coding-nvfp4", provider = "ollama", tool_format = "native" }
planner_deepseek = { id = "deepseek/deepseek-v3.2", provider = "openrouter", tool_format = "native" }
binder_cerebras = { id = "gpt-oss-120b", provider = "cerebras", tool_format = "native" }
binder_deepseek_openrouter = { id = "deepseek/deepseek-v3.2", provider = "openrouter", tool_format = "native" }

[dependencies]
# Pinned to a commit SHA rather than `branch = "main"` so a compromised commit
# to harn-github-connector@main can't propagate fleet-wide on the next bump-harn
# cron tick. Bump this rev (and harn.lock) deliberately when a new connector
# release ships and the maintainer has reviewed the diff.
harn-github-connector = { git = "https://github.com/burin-labs/harn-github-connector", rev = "36818d213816a19a30044197a9188d5b08a21d83" }
