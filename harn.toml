[package]
name = "harn-bump-fleet"
version = "0.1.0"
description = "Local Harn-version bump orchestrator across ~/projects/{*harn*,*burin*}"
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-bump-fleet"
harn = ">=0.10.53,<0.11"
docs_url = "README.md"

[exports]
fleet_manifest = "lib/fleet_manifest.harn"

[asset_roots]
prompts = "prompts"

[lint]
require_public_api_types = true

# Convenience aliases for the empirical best planner/binder cell from PR
# burin-labs/harn#1814. API keys come from the environment (sourced via
# scripts/with_env.sh from ~/projects/burin-code/.env or ./.env.local);
# these aliases only name the route, never the secret.
[llm.aliases]
qwen3_6_local = { id = "qwen3.6:35b-a3b-coding-nvfp4", provider = "ollama", tool_format = "native" }
planner_deepseek = { id = "deepseek/deepseek-v3.2", provider = "openrouter", tool_format = "native" }
binder_cerebras = { id = "gpt-oss-120b", provider = "cerebras", tool_format = "native" }
binder_deepseek_openrouter = { id = "deepseek/deepseek-v3.2", provider = "openrouter", tool_format = "native" }

[dependencies]
# Pinned to a reviewed release tag rather than `branch = "main"` so a
# compromised commit to harn-github-connector@main can't propagate fleet-wide
# on the next bump-harn cron tick. `harn.lock` records the commit the tag
# resolved to and a content hash, so the tag names the release while the lock
# is what installs actually verify. Bump both deliberately when a new release
# ships and the maintainer has reviewed the diff.
harn-github-connector = { git = "https://github.com/burin-labs/harn-github-connector", tag = "v0.6.8" }
