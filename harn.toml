[package]
name = "harn-bump-fleet"
version = "0.1.0"
description = "Local Harn-version bump orchestrator across ~/projects/{*harn*,*burin*}"

[asset_roots]
prompts = "prompts"

[llm.providers.llamacpp]
base_url = "http://127.0.0.1:8001"
base_url_env = "LLAMACPP_BASE_URL"
auth_style = "none"
chat_endpoint = "/v1/chat/completions"
completion_endpoint = "/v1/completions"

[llm.providers.llamacpp.healthcheck]
method = "GET"
path = "/v1/models"

[llm.aliases]
qwen3_6_local = { id = "qwen3.6-35b-a3b-ud-q4-k-xl", provider = "llamacpp", tool_format = "native" }
