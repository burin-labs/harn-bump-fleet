directory = "harn"

[[repositories]]
slug = "burin-labs/20eq"
directory = "20eq"
harn_package = true
package_ci_ownership = "pin"
harn_bump = true
bump_workflow_ownership = "fleet"

[[repositories]]
slug = "burin-labs/burin-code"
directory = "burin-code"
harn_bump = true
bump_workflow_ownership = "fleet"
bump_refresh_command = '''BURIN_HARN_FETCH_REQUIRE_RELEASE_ASSET=1 node --experimental-strip-types --no-warnings scripts/repin-harn.ts "$HARN_BUMP_TARGET_TAG"'''
bump_validate_command = '''BURIN_HARN_FETCH_REQUIRE_RELEASE_ASSET=1 node --experimental-strip-types --no-warnings scripts/repin-harn.ts "$HARN_BUMP_TARGET_TAG" --check'''
bump_node_version = "22"
# Merging this repository's bump IS its runtime repin, and a repin here decides
# questions an owner has reserved — which generated bindings are regenerated,
# and whether the surfaces that read them agree. Armed, the bump lands on its
# own checks overnight and makes that call by automation. So the pull request
# opens and runs its checks, but waits for a person to arm it.
# Restore auto-arming once (a) a bump has demonstrated the paused fix pass —
# skip notice present and a zero-drop `?.` census — and (b) repins here are
# routine again rather than individually ruled on.
bump_enable_auto_merge = false

[[repositories]]
slug = "burin-labs/harn-cloud"
directory = "harn-cloud"
harn_bump = true
bump_workflow_ownership = "fleet"
bump_refresh_notes = '''
`sync-agents-api-openapi.harn` needs --no-sandbox for two independent
reasons, and hit them one at a time (runs 30866899009, 30868657208):

  filesystem — the snapshot source is a clone in $RUNNER_TEMP, and the
    script reads it with `git -C "$upstream" show`. Sandboxed, that
    surfaces as `fatal: not a git repository`, which reads like a failed
    clone rather than a denied read.
  egress — `--filter=blob:none` defers blob download, so `git show` is a
    NETWORK call. Sandboxed, `Could not resolve host: github.com`.

The clone deliberately stays OUTSIDE the workspace. Moving it inside
would satisfy the filesystem half without --no-sandbox, but it would
also drop harn's entire `.harn` tree under the `harn fix --apply .` the
reusable workflow runs across this repo — a far worse trade.

`bump-harn-runtime-pins.harn` above already carries the same flag for
the same class of reason (it shells out to cargo).
'''
bump_refresh_command = '''
unset RUSTC_WRAPPER
harn run --no-sandbox scripts/bump-harn-runtime-pins.harn -- "$HARN_BUMP_TARGET_TAG"
upstream="$RUNNER_TEMP/harn-$HARN_BUMP_TARGET_TAG"
git clone --quiet --depth 1 --filter=blob:none --no-checkout \
  --branch "$HARN_BUMP_TARGET_TAG" https://github.com/burin-labs/harn.git "$upstream"
harn run --no-sandbox scripts/sync-agents-api-openapi.harn -- --harn-repo "$upstream"
./scripts/sync-harn-protocol-artifacts.sh --harn-repo "$upstream"
# docs/diagnostics-catalog.json mirrors `harn explain --catalog` from the
# PINNED runtime, so any release that adds or removes a code makes it
# stale the moment the pin moves. It was not refreshed here, so the bump
# committed a version it had itself invalidated and CI failed on the
# bump's own PR (#1467: v0.10.53 dropped HARN-LLM-001 and HARN-NAM-007).
#
# Same class as the snapshot above, and the rule is the same: whatever is
# derived from the Harn version is regenerated by the one command that
# changes the Harn version. No --no-sandbox -- this one only spawns
# `harn` inside the workspace, and least privilege is the default.
harn run scripts/check-diagnostics-catalog.harn -- --write
'''
bump_validate_command = '''
harn run scripts/check-harn-runtime-version.harn
harn run scripts/check-diagnostics-catalog.harn
upstream="$RUNNER_TEMP/harn-$HARN_BUMP_TARGET_TAG"
harn run --no-sandbox scripts/sync-agents-api-openapi.harn -- --harn-repo "$upstream" --check
./scripts/sync-harn-protocol-artifacts.sh --harn-repo "$upstream" --check
'''

