harn_package = true
package_ci_ownership = "pin"
package_validate_command = '''
test -d src
test -d tests
test -s harn.toml
scan_status=0
grep -REn '/private/tmp|/Users/' src tests harn.toml || scan_status=$?
if [ "$scan_status" -ne 1 ]; then
  echo "Portability scan must read every input and find no local absolute paths (grep exit $scan_status)." >&2
  exit 1
fi
'''
harn_bump = true
bump_workflow_ownership = "fleet"

