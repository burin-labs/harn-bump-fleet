# The index is not a Harn package, so it names its own gate here. These are the
# repository's own validation steps under the candidate runtime, minus the
# remote registry fetch: a bump proves the new runtime still reads the index and
# still runs the reconciler, and must not go red because a published package the
# index points at was momentarily unreachable.
bump_refresh_notes = '''
The index has no harn.toml and no generated sources. The bump's version-file
write is the whole refresh, so the inherited package install must not run.
'''
bump_refresh_command = '''
test -f harn-package-index.toml
'''
bump_validate_command = '''
set -eu
harn package registry verify harn-package-index.toml
harn test reconcile-index.test.harn
bash -n scripts/propose-index-drift.sh
'''

