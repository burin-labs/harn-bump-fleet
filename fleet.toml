schema_version = 1

[fleet]
default_root = "~/projects"
default_branch = "main"

[policy]
package_workflow = "burin-labs/.github/.github/workflows/harn-package.yml@546968aa9c3c08be94df6730f7e504fbfbe94450"
bump_workflow = "burin-labs/harn/.github/workflows/bump-harn.yml@bc6baec13ea39b4e1efa01a5f8fab2447152e4e4"
publish_failures_for_repair = true
# Harn's unattended `harn fix --apply --safety behavior-preserving` pass runs
# against caller-owned source on every managed runtime bump. Rule HARN-LNT-051
# strips `?.` from receivers it wrongly proves non-nil, so the pass ships
# behavior-CHANGING edits under a behavior-preserving safety tier (harn#6837).
# One bump removed 444 nil guards across 41 files in a member repository.
#
# The pass is paused fleet-wide, not withdrawn: capability migrations still
# apply, and a repository that has established the pass is safe for its own
# sources sets `bump_apply_behavior_preserving_fixes = true`. Restore this
# default to true once harn#6837 is fixed and the fix is proven.
apply_behavior_preserving_fixes = false
# Direction is declared now, while the projected syntax stays compatible with
# the released runtime. Flip this one owner to `direction-v1` only after a Harn
# release carrying the closed connector-secret record is available.
connector_secret_schema = "legacy"

[[repositories]]
slug = "burin-labs/harn"
directory = "harn"

[[repositories]]
slug = "burin-labs/20eq"
directory = "20eq"
harn_package = true
package_ci_ownership = "pin"
harn_bump = true
bump_workflow_ownership = "fleet"

[[repositories]]
slug = "burin-labs/burin-code"
directory = "burin-code"
consumer_owned_contract = true
harn_bump = true
bump_workflow_ownership = "fleet"
bump_prerequisites = ["burin-labs/homebrew-burin"]
# Burin enforces `[Area] Sentence case` on pull request titles. Runtime pin
# bumps land under its Harn area, so the fleet titles them that way rather than
# opening a pull request Burin's own gate would refuse.
pr_title_gate = true
pr_title_area = "Harn"
# Burin runs strict target-runtime Harn lint across its product and test
# sources. Normalize repairs under that runtime before validation, so a new
# error-level behavior-preserving rule arrives as part of the repin.
bump_apply_behavior_preserving_fixes = true

[[repositories]]
slug = "burin-labs/harn-cloud"
directory = "harn-cloud"
consumer_owned_contract = true
harn_bump = true
bump_workflow_ownership = "fleet"

[[repositories]]
slug = "burin-labs/harn-bump-fleet"
directory = "harn-bump-fleet"
harn_package = true
package_ci_ownership = "pin"
harn_bump = true
bump_workflow_ownership = "fleet"
bump_validate_command = '''
set -eu
scripts/harn-project.sh --tracked-only format
harn package verify . --strict
harn run --no-sandbox check_source_length.harn
harn test tests-risky --approve-risky git.push
'''

