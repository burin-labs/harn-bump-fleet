schema_version = 1

[fleet]
default_root = "~/projects"
default_branch = "main"

[policy]
package_workflow = "burin-labs/.github/.github/workflows/harn-package.yml@d77cdcf02cb2215982ea668582f53a73821ee90d"
bump_workflow = "burin-labs/harn/.github/workflows/bump-harn.yml@fb7275fa91979fd332edfcc7fdd5e70ce3026c2d"
publish_failures_for_repair = true
# Harn's unattended `harn fix --apply --safety behavior-preserving` pass runs
# against caller-owned source on every managed runtime bump. It carries the
# mechanical migrations a new runtime ships (HARN-NAM-013 rewrote the 0.10.167
# mutator and alias changes), so a bump without it fails on code the runtime
# could have fixed.
#
# Rule HARN-LNT-051 once stripped load-bearing `?.` under that tier
# (harn#6837; one bump removed 444 nil guards across 41 files). The rule is
# held back by code rather than by disabling the pass, so every other repair
# Harn rates format-only or behavior-preserving still applies.
apply_behavior_preserving_fixes = true
behavior_preserving_fix_exclude_codes = ["HARN-LNT-051"]
# Direction is declared now, while the projected syntax stays compatible with
# the released runtime. Flip this one owner to `direction-v1` only after a Harn
# release carrying the closed connector-secret record is available.
connector_secret_schema = "legacy"

[[repositories]]
slug = "burin-labs/harn"
directory = "harn"
shipping = { kind = "legacy" }
pr_title_gate = true
pr_title_area = "CI"
# What a release needs green on the commit it cuts, over and above what the
# rulesets require to merge. The active rulesets require exactly `CI status`
# and `drift`. The end-to-end suite runs on every push to the default branch,
# so the release-only classifier correctly calls it branch-covered and does not
# wait for it, and it is not ruleset-required either. Without this line it is
# in neither set and no release gate reads it, so it can be red on the exact
# commit being tagged. Naming it here puts it in the union the release decides
# on; the decision refuses by name if the workflow that produces it goes away.
release_required_contexts = ["Slow E2E suite"]

