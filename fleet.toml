schema_version = 1

[fleet]
default_root = "~/projects"
default_branch = "main"

[policy]
package_workflow = "burin-labs/.github/.github/workflows/harn-package.yml@a556b40acf7cbb278bd9b25b293fd99603656ef8"
bump_workflow = "burin-labs/harn/.github/workflows/bump-harn.yml@b1bf5bc89a93ee22b9cf9b5fef60f1a609352620"

[[file_projections]]
source_slug = "burin-labs/harn-packages"
source_path = "harn-package-index.toml"
target_slug = "burin-labs/harn-cloud"
target_path = "package-index/harn-package-index.toml"

[[file_projections]]
source_slug = "burin-labs/harn-canon"
source_path = "canon-packs.json"
target_slug = "burin-labs/burin-code"
target_path = "Sources/BurinCore/Resources/pipelines/data/canon-packs.json"

[[file_projections]]
source_slug = "burin-labs/harn"
source_path = ".codex/hooks.json"
target_slug = "burin-labs/burin-code"
target_path = ".codex/hooks.json"

[[file_projections]]
source_slug = "burin-labs/harn"
source_path = "scripts/agent-shell-guard.sh"
target_slug = "burin-labs/burin-code"
target_path = "scripts/agent-shell-guard.sh"

[[file_projections]]
source_slug = "burin-labs/harn"
source_path = "scripts/agent_shell_guard.harn"
target_slug = "burin-labs/burin-code"
target_path = "scripts/agent_shell_guard.harn"

[[repositories]]
slug = "burin-labs/harn"
directory = "harn"

[[repositories]]
slug = "burin-labs/20eq"
directory = "20eq"
harn_package = true
